<article>
  <div id="principal">
    <div id="holaUser">
      <div id="imgUser">
        <img src="assets/images/pedazo%20mono.jpg" id="profilePic">
      </div>
      <div id="textUser">
        <p>Hola <strong>{{Usuari?.nom}}</strong></p>
      </div>
    </div>

    <div id="opcionesUser">
      <div id="misDatos">

        <div id="izquierda">
          MIS DATOS
        </div>

        <div id="derecha" >
          <button (click)="activarEdicio()" class="botonesEditar" *ngIf="!editant"><img src="assets/images/editarIcono.png" height="30" width="30"> </button>

          <button (click)="guardarCanvis()" class="botonesEditar" *ngIf="editant"><img src="assets/images/guardarIcono.png" height="20" width="20"></button>
          <button (click)="cancelarEdicio()" class="botonesEditar" *ngIf="editant"><img src="assets/images/cancelarIcono.png" height="20" width="20"></button>
        </div>
      </div>

      <!-- VISTA NORMAL -->
      <ng-container *ngIf="!editant">
        <div class="ajustes">
          <div class="titulo">DATOS DE CONTACTO</div>
          <div class="contenido">
            <div class="nombre">{{Usuari?.nom}} {{Usuari?.cognoms}}</div>
            <div class="correo">{{Usuari?.email}}</div>
          </div>
        </div>

        <div class="ajustes">
          <div class="titulo">DIRECCIÓN PRINCIPAL</div>
          <div class="contenido">
            <div class="nombre">{{Usuari?.adreca || 'Sin dirección añadida'}}</div>
          </div>
        </div>

        <div class="final"></div>
      </ng-container>

      <!-- FORMULARIO EDICIÓN -->
      <ng-container *ngIf="editant">
        <div class="ajustes">
          <div class="titulo">DATOS DE CONTACTO</div>
          <div class="contenido">
            <input class="camposDatos"
              type="text"
              [(ngModel)]="nomEdit"
              placeholder="Nombre"
            >
            <input class="camposDatos"
              type="text"
              [(ngModel)]="cognomsEdit"
              placeholder="Apellidos"
            >
          </div>

        </div>

        <div class="ajustes">
          <div class="titulo">DIRECCIÓN PRINCIPAL</div>
          <div class="contenido">

            <input class="camposDatos"
                   type="text"
                   [(ngModel)]="adrecaEdit"
                   placeholder="Dirección"
            >
          </div>

        </div>

        <div class="final">

        </div>
      </ng-container>

    </div>
  </div>
</article>
