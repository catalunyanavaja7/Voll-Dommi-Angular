<article>
  <aside class="AD">
    <video autoplay muted loop playsinline id="imagenIzquierda">
      <source src="assets/video/anuncioNegro.mp4">
    </video>
  </aside>

  <div id="formulario">
    <table id="table">
      <tr>
        <td id="registro">Crear Cuenta</td>
      </tr>
      <tr>
        <td>
          <a routerLink="/sesion">
            <button id="login">Iniciar Sesion</button>
          </a>
        </td>
        <td>
          <button id="singin">Crear Cuenta</button>
        </td>
      </tr>
    </table>

    <form (ngSubmit)="registrar()">
      <input
        type="text"
        [(ngModel)]="nombre"
        name="nombre"
        placeholder="Ingrese su nombre"
        required
      >

      <input
        type="text"
        [(ngModel)]="apellido"
        name="apellido"
        placeholder="Ingrese su apellido"
        required
      >

      <input
        type="email"
        [(ngModel)]="email"
        name="correo"
        placeholder="Correo electronico"
        required
      >

      <input
        type="password"
        [(ngModel)]="password"
        name="contraseña"
        placeholder="Contraseña (Minimo 6 caracteres)"
        required
      >

      <input
        type="password"
        [(ngModel)]="confirmarPassword"
        name="confirmarContraseña"
        placeholder="Repita la contraseña"
        required
      >

      <tr>
        <td>
          <button id="registrarse">Registrarse</button>
        </td>
      </tr>
    </form>

    <app-captcha-modal
      [visible]="mostrarCaptcha"
      titulo="Captcha de registro"
      (confirmado)="confirmarCaptcha()"
      (cancelado)="cancelarCaptcha()"
    />
  </div>

  <aside class="AD">
    <video autoplay muted loop playsinline id="imagenDerecha">
      <source src="assets/video/anuncioAmarillo.mp4">
    </video>
  </aside>
</article>
