<article>
  <aside class="AD">
    <video autoplay muted loop playsinline id="imagenIzquierda">
      <source src="assets/video/anuncioNegro.mp4">
    </video>
  </aside>

  <div id="formulario">
    <table id="table">
      <tr>
        <td id="registro">Inicia Sesión</td>
      </tr>
      <tr>
        <td>
          <button id="login">Iniciar Sesion</button>
        </td>
        <td>
          <a routerLink="/registro">
            <button id="singin">Crear Cuenta</button>
          </a>
        </td>
      </tr>
    </table>

    <form (ngSubmit)="login()">
      <input
        type="email"
        [(ngModel)]="email"
        name="correo"
        placeholder="Correo electronico"
        required
      >

      <input
        type="password"
        [(ngModel)]="password"
        name="contraseña"
        placeholder="Contraseña"
        required
      >

      <tr>
        <td>
          <button id="iniciarSesion">Acceder</button>
        </td>
      </tr>
      <tr>
        <td>
          <button type="button" id="olvidarPassword" (click)="mostrarResetPassword()">
            ¿Has olvidado la contraseña?
          </button>
        </td>
      </tr>
    </form>
    <div *ngIf="mostrarModalReset" class="modal-overlay" (click)="cerrarModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h2>Restablecer Contraseña</h2>
        <p>Introduce tu email y te enviaremos tu contraseña</p>

        <input
          type="email"
          [(ngModel)]="emailReset"
          placeholder="Tu correo electrónico"
          id="inputReset"
        >

        <div class="modal-buttons">
          <button type="button" (click)="resetPassword()" id="btnEnviar">
            Enviar
          </button>
          <button type="button" (click)="cerrarModal()" id="btnCancelar">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
  <aside class="AD">
    <video autoplay muted loop playsinline id="imagenDerecha">
      <source src="assets/video/anuncioAmarillo.mp4">
    </video>
  </aside>
</article>
