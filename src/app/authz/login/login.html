<article>
  <aside class="AD">
    <video autoplay muted loop playsinline id="imagenIzquierda">
      <source src="assets/video/anuncioNegro.mp4">
    </video>
  </aside>

  <div id="formulario">
    <table id="table">
      <tr>
        <td id="registro">Inicia Sesión</td>
      </tr>
      <tr>
        <td>
          <button id="login">Iniciar Sesion</button>
        </td>
        <td>
          <a routerLink="/registro">
            <button id="singin">Crear Cuenta</button>
          </a>
        </td>
      </tr>
    </table>

    <form (ngSubmit)="login()">
      <input
        type="email"
        [(ngModel)]="email"
        name="correo"
        placeholder="Correo electronico"
        required
      >

      <input
        type="password"
        [(ngModel)]="password"
        name="contraseña"
        placeholder="Contraseña"
        required
      >

      <tr>
        <td>
          <button id="iniciarSesion">Acceder</button>
        </td>
      </tr>
    </form>


  </div>

  <aside class="AD">
    <video autoplay muted loop playsinline id="imagenDerecha">
      <source src="assets/video/anuncioAmarillo.mp4">
    </video>
  </aside>


</article>
