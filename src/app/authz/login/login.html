<div id="navbar"></div>
<article>
  <div id="formulario">

    <table id="tabla">
      <tr>
        <td id="registro">Inicia Sesión</td>
      </tr>
      <tr>
        <td>
          <button id="login">Iniciar Sesion</button>
        </td>
        <td>
          <a routerLink="/registro"><button id="singin">Crear Cuenta</button></a>
        </td>
      </tr>
      <form>
        <tr>
          <td><input class="campos" type="email" name="correo" id="correo" placeholder="Correo electronico"
                     required></td>
        </tr>
        <tr>
          <td><input class="campos" type="password" name="contraseña" id="contraseña" placeholder="Contraseña"
                     required></td>
        </tr>
        <tr>
          <td><button id="acceder">Acceder</button></td>
        </tr>

      </form>
    </table>

  </div>


</article>


<script>
  fetch("../plantillas/menuPlantilla.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;
      inicializarMenu();
    })


  const navbar = document.getElementById('navbar');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 80) {
      navbar.classList.add('shrink');
    } else {
      navbar.classList.remove('shrink');
    }
  });
</script>
