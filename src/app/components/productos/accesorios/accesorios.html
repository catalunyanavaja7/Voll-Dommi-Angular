<!-- SECCIÓN DE FILTROS -->
<div class="filtros">
  <div class="buscador">
    <input
      type="text"
      [(ngModel)]="searchText"
      (input)="filtrarAccesorios()"
      placeholder="Buscar accesorio..."
    >
  </div>

  <div class="categoria">
    <select
      [(ngModel)]="selectedCategory"
      (change)="filtrarAccesorios()"
    >
      <option value="todas">Todos los accesorios</option>
      <option value="vasos">Vasos</option>
      <option value="jarras">Jarras</option>
      <option value="copas">Copas</option>
      <option value="posavasos">Posavasos</option>
    </select>
  </div>
</div>

<!-- CATÁLOGO DE ACCESORIOS -->
<div id="contenido">
  <div id="accesorios">

    <ng-container *ngFor="let accesorio of accesoriosFiltrados">
      <!-- Si tiene ruta, muestra el enlace -->
      <a *ngIf="accesorio.ruta" [routerLink]="accesorio.ruta">
        <div [class]="accesorio.clase" [attr.data-categoria]="accesorio.categoria">
          <img [src]="accesorio.imagen" [alt]="accesorio.nombre" />
          <h2>{{ accesorio.nombre }}</h2>
          <p>{{ accesorio.precio }}</p>
        </div>
      </a>


      <div
        *ngIf="!accesorio.ruta"
        [class]="accesorio.clase"
        [attr.data-categoria]="accesorio.categoria"
      >
        <img [src]="accesorio.imagen" [alt]="accesorio.nombre" />
        <h2>{{ accesorio.nombre }}</h2>
        <p>{{ accesorio.precio }}</p>
      </div>
    </ng-container>

    <!-- Mensaje cuando no hay resultados -->
    <div class="no-resultados" *ngIf="accesoriosFiltrados.length === 0">
      <div class="no-resultados-icon">🍺</div>
      <h3>No se encontraron accesorios</h3>
      <p>Intenta con otros términos de búsqueda o categoría</p>
    </div>

  </div>
</div>
