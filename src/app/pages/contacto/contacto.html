<div id="contacto">
  <h1>Contacto</h1>
  <form class="contacto-form" (ngSubmit)="enviarFormulario()">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required>

    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required>

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" rows="5" [(ngModel)]="mensaje" required></textarea>

    <button type="submit">Enviar</button>
  </form>

  <app-captcha-modal
    [visible]="mostrarCaptcha"
    titulo="Captcha de contacto"
    (confirmado)="confirmarCaptcha()"
    (cancelado)="cancelarCaptcha()"
  />
</div>
